services:
  - type: web
    name: prodhin-api
    runtime: node
    region: ohio
    plan: free
    buildCommand: cd apps/api && npm install && npx prisma generate && npx tsc -p tsconfig.build.json
    startCommand: node apps/api/dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
